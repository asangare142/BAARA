services:
  - type: web
    name: baara
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: baara-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOM
        sync: false
